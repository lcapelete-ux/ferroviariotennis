<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Tennis FFC Agendamentos</title>
  <script>
    // GitHub Pages SPA routing — redirect 404s back to index.html with the path encoded as a query param.
    // pathSegmentsToKeep=1 preserves the repo name segment (/ferroviariotennis) in the redirect target.
    var pathSegmentsToKeep = 1;
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.host +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
